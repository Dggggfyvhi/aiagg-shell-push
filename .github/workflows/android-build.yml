name: Build Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or update GitHub Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-${{ github.run_number }}"
          RESPONSE="$(curl -sS -X POST \
            -H 'Authorization: token ${GITHUB_TOKEN}' \
            -H 'Content-Type: application/json' \
            -d '{\"tag_name\":\"'"$TAG"'\"}" \
            'https://api.github.com/repos/${{ github.repository }}/releases')"
          RELEASE_ID="$(echo "$RESPONSE" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("id",""))')"
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "None" ]; then
            echo "release id not found, response:"
            echo "$RESPONSE"
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload APK as release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSET_NAME="app-debug.apk"
          echo "uploading $ASSET_NAME"
          curl -sS -L \
            -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            -H "Content-Length: $(stat -c%s ${{ github.workspace }}/app/build/outputs/apk/debug/$ASSET_NAME)" \
            --data-binary @${{ github.workspace }}/app/build/outputs/apk/debug/$ASSET_NAME \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$ASSET_NAME"
          echo "asset uploaded"

      - name: Print permanent download hint
        run: |
          echo "Permanent download available under:"
          echo "https://github.com/${{ github.repository }}/releases"
